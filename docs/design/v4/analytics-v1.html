const WRONG_POOL={3:[['көнлар','sin'],['көнлар','sin'],['конннәр','let'],['көнлар','sin']],

 const sel=LETTERS.find(x=>x[0]===L);
 return `${sbar()}<div class="view">${hdr('Буквы класса','test')}<div class="scroll stagger">
 <div class="px-1"><div class="h2">Татарские буквы — главный источник ошибок</div><div class="small muted mt-1">% неверно написанных из всех встреч буквы · 7-А, 5 работ</div></div>
 <div class="card mt-5 p-4"><div class="eyebrow mb-3">Татарские</div><div class="grid grid-cols-3 gap-2">${tat.map(x=>key(x,true)).join('')}</div>
  <div class="eyebrow mt-5 mb-3">Остальные</div><div class="grid grid-cols-8 gap-1.5">${rest.map(x=>key(x,false)).join('')}</div></div>
 <div class="flex items-center gap-4 mt-3 px-1 cap faint"><span style="color:var(--bad)">● ≥30%</span><span style="color:var(--mid)">● 15–30%</span><span style="color:#C9D86A">● 8–15%</span><span>тап по букве</span></div>
 <div class="card mt-5 p-4 flex gap-3"><span style="color:var(--pr)">${ic('spark',20)}</span><div class="small"><b>ә и ң</b> <span class="muted">дают больше половины всех буквенных ошибок. 10 минут на диктант с этими буквами закроют большую часть проблемы.</span></div></div>
 </div></div>
 ${sel?`<div class="scrim" data-letter=""></div><div class="sheet"><div class="grab"></div>
  <div class="flex items-center gap-4"><div class="w-16 h-16 rounded-2xl flex items-center justify-center text-[34px] font-bold" style="background:color-mix(in srgb,${col(sel[1])} 22%,var(--s2));color:${col(sel[1])}">${sel[0]}</div><div><div class="h2">Ошибка в ${sel[1]}%</div><div class="small muted">${sel[2]?'Чаще всего путают с одной буквой':'Редкие ошибки, без системы'}</div></div></div>
  ${sel[2]?`<div class="flex items-center justify-center gap-5 mt-6"><span class="text-[40px] font-bold">${sel[0]}</span><span class="faint">${ic('chev',24)}</span><span class="text-[40px] font-bold" style="color:var(--bad)">${sel[2]}</span><span class="num h2 muted ml-2">${sel[3]}%</span></div>
  <div class="small muted text-center mt-1">из всех ошибок в букве «${sel[0]}»</div>
  <div class="flex items-center justify-between mt-6"><span class="small muted">Чаще ошибаются</span>${avs([3,7,10,13,6],5,28)}</div>
  <div class="rounded-xl p-3 mt-4 flex gap-2 cap" style="background:var(--s2)"><span style="color:var(--mid)">${ic('alert',16)}</span><span class="muted">Если ученик пишет букву верно, а приложение видит «${sel[2]}» — проверьте распознавание в разборе.</span></div>
  <button class="btn mt-5" data-act="cards">${ic('print',22,'#03140B')} Диктант на «${sel[0]}» ×5</button>`:`<button class="btn2 mt-6" data-letter="">Закрыть</button>`}</div>`:''}`},

/* ---------- 6. STUDENT ---------- */
student:()=>{const i=st.student;const W=318,H=150;const pts=HIST.map((h,k)=>[16+k*(W-32)/(HIST.length-1),H-14-(h[2]-30)/(100-30)*(H-34)]);const cls=CLASS_AVG.map((v,k)=>[16+k*(W-32)/(HIST.length-1),H-14-(v-30)/(100-30)*(H-34)]);
 const path=p=>'M'+p.map(x=>x.join(',')).join(' L');const area=path(pts)+` L${pts.at(-1)[0]},${H} L${pts[0][0]},${H} Z`;
 const last=HIST.at(-1)[2], d=last-HIST.at(-2)[2];
 return `${sbar()}<div class="view">${hdr('','test')}<div class="scroll stagger">
 <div class="flex items-center gap-4 px-1">${av(i,60,'var(--prs)')}<div><div class="h2">${STUDENTS[i]}</div><div class="small muted">7-А · 5 работ · средняя «3,0»</div></div></div>
 <div class="card mt-5 p-4" style="background:linear-gradient(180deg,#141D18 0%,#121815 100%)"><div class="flex items-end justify-between px-1"><div><div class="eyebrow">Последняя работа</div><div class="num font-bold mt-1" style="font-size:40px;line-height:1">${last}<span class="text-[20px] muted">%</span></div></div><div class="text-right">${delta(d)}<div class="cap faint mt-1">к прошлой</div></div></div>
  <svg width="${W}" height="${H}" class="mt-3 block"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25E38A" stop-opacity=".35"/><stop offset="1" stop-color="#25E38A" stop-opacity="0"/></linearGradient></defs>
   ${[50,70,85].map(v=>{const y=H-14-(v-30)/(70)*(H-34);return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.05)"/><text x="${W-2}" y="${y-3}" text-anchor="end" font-size="10" fill="#4F5E56">${v===50?'«3»':v===70?'«4»':'«5»'}</text>`}).join('')}
   <path d="${area}" fill="url(#ga)" class="growy"/><path d="${path(cls)}" fill="none" stroke="#6F8077" stroke-width="1.5" stroke-dasharray="4 4"/><path d="${path(pts)}" fill="none" stroke="#25E38A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" class="draw"/>
   ${pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${k===pts.length-1?6:4}" fill="${k===pts.length-1?'#25E38A':'#131916'}" stroke="#25E38A" stroke-width="2"/>`).join('')}
  </svg>
  <div class="flex justify-between px-1 mt-1">${HIST.map(h=>`<span class="cap faint text-center" style="width:56px">${h[1]}</span>`).join('')}</div>
  <div class="flex items-center gap-4 mt-3 px-1 cap faint"><span><span class="inline-block w-3 h-[3px] rounded mr-1.5 align-middle" style="background:var(--pr)"></span>${short(STUDENTS[i])}</span><span><span class="inline-block w-3 border-t border-dashed mr-1.5 align-middle" style="border-color:#6F8077"></span>средний по классу</span></div>
  <div class="rounded-2xl p-3 mt-4 flex gap-2.5" style="background:rgba(245,185,66,.08)"><span style="color:var(--mid)">${ic('spark',18)}</span><div class="small"><b>Просел на новой теме.</b> <span class="muted">До «Килешләр» рос три работы подряд. Ошибки в заданиях 3 и 4 — оба про сингармонизм.</span></div></div></div>
 <div class="h3 mt-8 px-1">Над чем работать</div>
 <div class="card mt-3 p-4">${[['Юнәлеш килеше',40,'4 из 10 верно'],['Урын-вакыт килеше',55,'6 из 11'],['Күплек сан',78,'7 из 9']].map(([t,a,s])=>`<div class="flex items-center gap-3 py-2.5"><div class="flex-1"><div class="small font-semibold">${t}</div><div class="cap faint">${s}</div></div><div class="w-[90px] h-2 rounded-full" style="background:var(--s3)"><div class="h-full rounded-full grow" style="width:${a}%;background:${ZC[zone(a)]}"></div></div><span class="num small w-9 text-right" style="color:${ZC[zone(a)]}">${a}%</span></div>`).join('')}</div>
 <div class="h3 mt-8 px-1">Путает буквы</div>
 <div class="grid grid-cols-3 gap-3 mt-3">${[['ә','а',5],['ң','н',3],['ү','у',2]].map(([a,b,n])=>`<div class="card p-3 text-center"><div class="text-[22px] font-bold">${a} <span class="faint text-[16px]">→</span> <span style="color:var(--bad)">${b}</span></div><div class="cap muted mt-1">${n} раза</div></div>`).join('')}</div>
 <div class="card mt-3 p-4 flex items-center gap-3"><span class="faint">${ic('eye',20)}</span><div class="flex-1 small muted">Почерк читается хорошо — ошибки не из-за распознавания.</div></div>
 </div><div class="foot"><button class="btn" data-act="cards">${ic('print',22,'#03140B')} Карточка для ${STUDENTS[i].split(' ')[1]}а</button></div></div>`},

/* ---------- 7. REPORT ---------- */
report:()=>{const ra=ruleAgg();return `${sbar()}<div class="view">${hdr('Анализ для завуча','test')}<div class="scroll">
 <div class="paperdoc mt-2 p-5 text-[12px] leading-snug" style="box-shadow:0 30px 60px -30px rgba(0,0,0,.8)">
  <div class="flex items-center justify-between"><span class="font-bold text-[11px]" style="color:#0D8F54">КАРА КУЯН</span><span style="color:#6B776F">03.11.2026</span></div>
  <div class="text-[16px] font-bold mt-2 leading-tight">Анализ контрольной работы «Килешләр»</div>
  <div class="mt-1" style="color:#56655C">7-А · татарский язык · Гөлнара Ильдаровна · по списку ${N}, писали ${N}</div>
  <div class="grid grid-cols-4 gap-2 mt-4">${[[QUAL+'%','качество'],[USP+'%','успеваем.'],[AVG.toFixed(1).replace('.',','),'ср. балл'],[SOU+'%','СОУ']].map(([v,l])=>`<div class="rounded-lg p-2" style="background:#E7ECE8"><div class="text-[16px] font-bold">${v}</div><div class="text-[10px]" style="color:#56655C">${l}</div></div>`).join('')}</div>
  <div class="flex h-3 rounded overflow-hidden mt-3 gap-[2px]">${[5,4,3,2].map(g=>`<div style="flex:${dist[g]};background:${{5:'#1FBF73',4:'#3AA7D6',3:'#E0A52E',2:'#E25555'}[g]}"></div>`).join('')}</div>
  <div class="flex justify-between mt-1 text-[10px]" style="color:#56655C">${[5,4,3,2].map(g=>`<span>«${g}» — ${dist[g]} (${Math.round(dist[g]/N*100)}%)</span>`).join('')}</div>
  <div class="font-bold mt-4 mb-1">Поэлементный анализ</div>
  <table class="w-full text-[11px]"><tr style="color:#56655C"><th>№</th><th>Проверяемый элемент</th><th>Справились</th><th>%</th></tr>${TASKS.map((t,j)=>`<tr><td>${t.n}</td><td>${t.skill}</td><td>${N-wrongs(j).length}</td><td style="font-weight:700;color:${acc(j)<50?'#D23B3B':acc(j)<80?'#B7801A':'#14995B'}">${acc(j)}</td></tr>`).join('')}</table>
  <div class="font-bold mt-4 mb-1">Типичные ошибки</div>
  ${ra.map(([k,v])=>`<div class="flex justify-between py-0.5"><span>${RULES[k].name} — ${RULES[k].hint}</span><b class="whitespace-nowrap pl-3">${v.st.size} уч.</b></div>`).join('')}
  <div class="font-bold mt-4 mb-1">План коррекции</div>
  <div>1. Повторить правило сингармонизма в падежных аффиксах (задание 4) со всем классом.</div><div>2. Карточки на букву «ә» — 4 ученика.</div><div>3. Консультация: ${STUDENTS.filter((_,i)=>grade(i)===2).map(short).join(', ')}.</div>
 </div>
 <div class="cap faint text-center mt-3">Собрано автоматически · можно править перед отправкой</div>
 </div><div class="foot grid grid-cols-2 gap-3"><button class="btn2" data-act="copy">Копировать в Word</button><button class="btn" style="height:48px;font-size:15px" data-act="pdf">${ic('share',18,'#03140B')} PDF завучу</button></div></div>`}
};

/* ---------- helpers that need data ---------- */
function topAnswers(j){const m={};wrongs(j).forEach(w=>{m[w.ans]=m[w.ans]||{ans:w.ans,rule:w.rule,n:0,who:[]};m[w.ans].n++;m[w.ans].who.push(w.i)});return Object.values(m).sort((a,b)=>b.n-a.n)}
function diffWord(a,e){let out='';for(let k=0;k<Math.max(a.length,e.length);k++){const ch=a[k]||'';out+=ch!==e[k]?`<span style="color:var(--bad);text-decoration:underline;text-underline-offset:4px">${ch||'_'}</span>`:ch}return out}
function donut(v,s,w,c){const r=(s-w)/2,C=2*Math.PI*r;return `<svg width="${s}" height="${s}" style="transform:rotate(-90deg)"><circle cx="${s/2}" cy="${s/2}" r="${r}" stroke="var(--s3)" stroke-width="${w}" fill="none"/><circle cx="${s/2}" cy="${s/2}" r="${r}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-v/100)}" style="transition:stroke-dashoffset 1s"/></svg>`}

/* ---------- engine ---------- */
const screenEl=document.getElementById('screen');let STILL=false;
function go(id){const i=idx(id);if(i>=0){cur=i;render()}}
function render(keep){const s=SCREENS[cur];let html=R[s.id]();
  const dir=keep||prevId===s.id||prevId===null?'':(idx(prevId)<cur?'fwd':'bwd');if(dir)html=html.replace('class="view"','class="view '+dir+'"');
  if(keep||prevId===s.id)html=html.replace(/class="scroll stagger"/g,'class="scroll"');
  screenEl.innerHTML=html+(st.toast?`<div class="toast"><span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#0D8F54">${ic('check',20,'#fff',2.6)}</span>${st.toast}</div>`:'')+'<div class="gbar"></div>';prevId=s.id;
  if(!STILL&&!keep)screenEl.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};el.textContent='0';requestAnimationFrame(step)});
  document.getElementById('counter').textContent=`${cur+1} / ${SCREENS.length}`;rail();notes()}
function rail(){document.getElementById('rail').innerHTML=SCREENS.map((s,i)=>`<button data-jump="${i}" class="text-left py-2 px-3 rounded-lg flex items-center gap-3 text-sm ${i===cur?'bg-[var(--card)] text-[var(--foreground)] font-medium':'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}"><span class="text-[11px] uppercase tracking-wider w-16 opacity-70">${s.lvl}</span>${s.title.split(' · ')[0]}</button>`).join('')}
function notes(){const s=SCREENS[cur];document.getElementById('notes').innerHTML=`
  <div class="text-xs uppercase tracking-wider text-[var(--muted-foreground)]">${s.lvl}</div>
  <h2 class="text-2xl font-semibold mt-1">${s.title}</h2>
  <p class="mt-3 text-[17px]">«${s.q}»</p>
  <div class="text-xs uppercase tracking-wider text-[var(--muted-foreground)] mt-6">Что на экране</div>
  <ul class="mt-2 flex flex-col gap-2">${s.show.map(x=>`<li class="flex gap-3"><span class="mt-2 w-1.5 h-1.5 rounded-full flex-none" style="background:#25E38A"></span><span>${x}</span></li>`).join('')}</ul>
  <div class="text-xs uppercase tracking-wider text-[var(--muted-foreground)] mt-6">Данные из API</div>
  <ul class="mt-2 flex flex-col gap-1.5 text-sm">${s.data.map(x=>`<li class="font-mono text-[12.5px] text-[var(--muted-foreground)]">${x}</li>`).join('')}</ul>
  <div class="text-xs uppercase tracking-wider mt-6" style="color:#E0A52E">Нужно от бэкенда</div>
  <ul class="mt-2 flex flex-col gap-1.5 text-sm">${s.gap.map(x=>`<li class="flex gap-2"><span style="color:#E0A52E">⚠</span><span>${x}</span></li>`).join('')}</ul>
  <div class="text-xs uppercase tracking-wider text-[var(--muted-foreground)] mt-6">Референсы</div>
  <div class="mt-2 flex flex-wrap gap-2">${s.ref.map(([t,u])=>`<a href="${u}" target="_blank" class="text-sm px-3 h-8 inline-flex items-center rounded-lg border border-[var(--border)] hover:bg-[var(--card)]">${t}</a>`).join('')}</div>`}
const TOASTS={cards:'Карточки добавлены в печать',copy:'Скопировано · вставьте в Word',pdf:'PDF готов · выберите получателя'};
screenEl.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-stu],[data-task],[data-col],[data-sort],[data-letter],[data-act],[data-period]');if(!t)return;const d=t.dataset;
  if(d.stu!==undefined){st.student=+d.stu;go('student')}
  else if(d.task!==undefined){st.task=+d.task;go('task')}
  else if(d.col!==undefined){st.col=st.col===+d.col?null:+d.col;render(true)}
  else if(d.sort){st.sort=d.sort;render(true)}
  else if(d.period){st.period=d.period;render(true)}
  else if(d.letter!==undefined){st.letter=d.letter||null;render(true)}
  else if(d.act){st.toast=TOASTS[d.act];render(true);setTimeout(()=>{st.toast='';render(true)},1800)}
  else if(d.go){if(d.go==='task')st.task=3;go(d.go)}});
document.getElementById('rail').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(b){cur=+b.dataset.jump;render()}});
document.getElementById('prev').onclick=()=>{cur=(cur-1+SCREENS.length)%SCREENS.length;render()};
document.getElementById('next').onclick=()=>{cur=(cur+1)%SCREENS.length;render()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});
{const [h,m]=location.hash.slice(1).split('~');const i=idx(h);if(i>=0)cur=i;if(m==='still'){STILL=true;document.body.classList.add('still')}if(location.hash.includes('col'))st.col=3;if(location.hash.includes('letter'))st.letter='ә'}
render();
</script>
</body>
</html>
