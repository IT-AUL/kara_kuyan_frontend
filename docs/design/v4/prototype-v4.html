 </div></div>
 ${sel?`<div class="scrim" data-letter=""></div><div class="sheet"><div class="grab"></div>

  <div class="small muted text-center mt-1">из всех ошибок в букве «${sel[0]}»</div>

  <button class="btn mt-5" data-act="cards">${ic('print',22,'#03140B')} Диктант на «${sel[0]}» ×5</button>`:`<button class="btn2 mt-6" data-letter="">Закрыть</button>`}</div>`:''}`},

student:()=>{const i=st.student;const W=318,H=150;const pts=HIST.map((h,k)=>[16+k*(W-32)/(HIST.length-1),H-14-(h[2]-30)/(100-30)*(H-34)]);const cls=CLASS_AVG.map((v,k)=>[16+k*(W-32)/(HIST.length-1),H-14-(v-30)/(100-30)*(H-34)]);
 const path=p=>'M'+p.map(x=>x.join(',')).join(' L');const area=path(pts)+` L${pts.at(-1)[0]},${H} L${pts[0][0]},${H} Z`;

 return `${sbar()}<div class="view">${hdr('','test')}<div class="scroll stagger">

   ${[50,70,85].map(v=>{const y=H-14-(v-30)/(70)*(H-34);return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.05)"/><text x="${W-2}" y="${y-3}" text-anchor="end" font-size="10" fill="#4F5E56">${v===50?'«3»':v===70?'«4»':'«5»'}</text>`}).join('')}
   <path d="${area}" fill="url(#ga)" class="growy"/><path d="${path(cls)}" fill="none" stroke="#6F8077" stroke-width="1.5" stroke-dasharray="4 4"/><path d="${path(pts)}" fill="none" stroke="#25E38A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" class="draw"/>
   ${pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${k===pts.length-1?6:4}" fill="${k===pts.length-1?'#25E38A':'#131916'}" stroke="#25E38A" stroke-width="2"/>`).join('')}
  </svg>
  <div class="flex justify-between px-1 mt-1">${HIST.map(h=>`<span class="cap faint text-center" style="width:56px">${h[1]}</span>`).join('')}</div>
  <div class="flex items-center gap-4 mt-3 px-1 cap faint"><span><span class="inline-block w-3 h-[3px] rounded mr-1.5 align-middle" style="background:var(--pr)"></span>${short(STUDENTS[i])}</span><span><span class="inline-block w-3 border-t border-dashed mr-1.5 align-middle" style="border-color:#6F8077"></span>средний по классу</span></div>

 <div class="grid grid-cols-3 gap-3 mt-3">${[['ә','а',5],['ң','н',3],['ү','у',2]].map(([a,b,n])=>`<div class="card p-3 text-center"><div class="text-[22px] font-bold">${a} <span class="faint text-[16px]">→</span> <span style="color:var(--bad)">${b}</span></div><div class="cap muted mt-1">${n} раза</div></div>`).join('')}</div>

  </div><div class="foot" style="padding-bottom:14px"><button class="btn" data-go="scan">${ic('scan',22,'#03140B')} Сканировать</button></div>${nav('queue')}</div>`},

done:()=>`${sbar()}<div class="view"><div class="absolute inset-0 overflow-hidden pointer-events-none" id="conf"></div><div class="scroll flex flex-col items-center text-center">
  <div class="relative mt-14"><div class="glow" style="width:220px;height:220px;left:-60px;top:-60px;background:rgba(37,227,138,.35)"></div>
   <div class="w-[104px] h-[104px] rounded-full flex items-center justify-center pop-in relative" style="background:var(--pr);box-shadow:0 20px 50px -10px rgba(37,227,138,.6)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#03140B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="check-draw"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div></div>
  <div class="h1 mt-9" style="font-size:32px">Класс проверен</div>
  <div class="body muted mt-2">16 из 16 · за 9 минут 40 секунд</div>
  <div class="grid grid-cols-3 gap-2.5 w-full mt-9 stagger">${[['clock','≈45','мин сэкономлено','var(--pr)'],['chart',QUAL+'%','качество','var(--g4)'],['eye',st.review,'спорных','var(--wa)']].map(([i,v,l,c])=>`<div class="card py-4 px-2" style="box-shadow:0 0 0 1px color-mix(in srgb,${c} 25%,transparent) inset"><div class="flex justify-center" style="color:${c}">${ic(i,18)}</div><div class="num text-[26px] font-bold mt-1.5" style="color:${c}">${v}</div><div class="cap muted">${l}</div></div>`).join('')}</div>
  <div class="cap faint mt-4">По сравнению с проверкой вручную</div>
  </div><div class="foot">${st.review?`<button class="btn" data-go="review">Разобрать ${st.review} спорных</button><button class="w-full h-12 mt-1 small muted" data-go="test">Сразу к итогам</button>`:`<button class="btn" data-go="test">Посмотреть итоги</button><button class="w-full h-12 mt-1 small muted" data-go="report">${ic('share',14)} Отправить завучу</button>`}</div></div>`,

review:()=>{const items=[{i:3,w:'мәктәп',got:'А',alt:'Ә',g:'Ә'},{i:4,w:'көн',got:'О',alt:'Ө',g:'Ө'},{i:7,w:'мәктәп',got:'А',alt:'Ә',g:'Ә'}];const k=Math.min(st.decided,2),it=items[k];
 return `${sbar()}<div class="view">${hdr(`Разбор · ${k+1} из 3`,'queue',`<button class="small muted px-3" data-go="test">Позже</button>`)}<div class="scroll">
  <div class="flex items-center justify-between mt-1"><span class="tag" style="background:rgba(255,107,107,.12);color:var(--bad)">${ic('x',12,'currentColor',3)} ${st.no||0}</span><div class="flex gap-1">${items.map((_,n)=>`<span class="h-1.5 rounded-full" style="width:${n===k?22:8}px;background:${n<k?'var(--pr)':n===k?'var(--tx)':'var(--s3)'};transition:width .3s"></span>`).join('')}</div><span class="tag" style="background:rgba(37,227,138,.12);color:var(--ok)">${ic('check',12,'currentColor',3)} ${st.yes||0}</span></div>
  <div class="flex items-center gap-3 mt-5">${av(it.i,36,'var(--bg)')}<div><div class="small font-semibold">${STUDENTS[it.i]}</div><div class="cap muted">${it.w} → задание ${it.w==='көн'?3:4}</div></div></div>
  <div class="card-stack mt-5">${k<2?`<div class="rcard back"></div>`:''}<div class="rcard" id="rcard"><span class="stamp no">ОШИБКА</span><span class="stamp ok">ВЕРНО</span>
    <div class="rounded-2xl flex items-center justify-center hand" style="width:170px;height:186px;background:#fff;font-size:130px;line-height:1">${it.g}</div>
    <div class="mt-5 body"><span class="muted">Это</span> <b>${it.alt}</b> <span class="muted">или</span> <b>${it.got}</b>?</div></div></div>
  <div class="cap faint text-center mt-4">← смахните или нажмите кнопку →</div>
  ${st.decided===0?`<button data-go="group" class="w-full mt-4 h-11 rounded-xl small font-semibold flex items-center justify-center gap-2" style="color:var(--wa);background:var(--was)">${ic('people',16)} Так же ещё у 5 учеников</button>`:''}
  </div><div class="foot grid grid-cols-2 gap-3"><button class="btn2" data-decide="no" style="color:var(--er)">${ic('x',20,'#FF6B6B',2.6)} Ошибка</button><button class="btn" data-decide="ok">${ic('check',20,'#03140B',2.8)} Верно</button></div>
  ${st.decided>0?`<div class="toast" style="top:48px;bottom:auto"><span class="flex-1">${STUDENTS[items[st.decided-1].i].split(' ')[1]}: ${st.last==='ok'?'засчитано':'ошибка'}</span><button data-undo="1" class="flex items-center gap-1.5" style="color:var(--prd)">${ic('undo',16,'#0D8F54')} Отменить</button></div>`:''}</div>`},

group:()=>`${R.review()}<div class="scrim" data-go="review"></div><div class="sheet"><div class="grab"></div>
  <div class="h2">Одна буква в 6 работах</div><div class="small muted mt-1">мәктәп → вторая буква</div>
  <div class="mt-6 grid grid-cols-6 gap-2">${[0,1,2,3,4,5].map(i=>`<div class="hand rounded-lg flex items-center justify-center" style="height:52px;background:#fff;font-size:32px;transform:rotate(${(i%3-1)*3}deg)">Ә</div>`).join('')}</div>
  <button class="btn mt-8" data-groupok="1">Всем «Ә» — верно</button><button class="w-full h-12 mt-2 small muted" data-go="review">Решать по одной</button></div>`,

journal:()=>`${AR.test()}<div class="scrim" data-go="test"></div><div class="sheet"><div class="grab"></div>
  <div class="h2">В электронный журнал</div><div class="small muted mt-1">Контрольная работа · 3 ноября · в порядке журнала</div>
  <div class="mt-5 rounded-2xl px-4" style="background:var(--s2)">${STUDENTS.slice(0,5).map((n,i)=>`<div class="row" style="padding:9px 0;border-color:#2A352F"><span class="flex-1 small">${n}</span>${gpill(grade(i),28)}</div>`).join('')}<div class="cap faint py-2.5">и ещё 11</div></div>
  <button class="btn mt-5 ${st.copied?'bump':''}" data-copy="1">${st.copied?ic('check',22,'#03140B',2.6)+' Скопировано · 16 оценок':ic('copy',22,'#03140B')+' Скопировать колонку'}</button>
  <button class="w-full h-12 mt-1 small muted">Скачать gradebook.xlsx</button></div>`,

more:()=>`${sbar()}<div class="view"><div class="px-5 pt-3 pb-1 h1">Ещё</div><div class="scroll stagger">
  <div class="card mt-4 p-5" style="${st.offline?'background:linear-gradient(160deg,#2A2312,#141713 70%)':''}"><div class="flex items-center gap-4">${st.offline?`<span class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:var(--was);color:var(--wa)">${ic('phone',22)}</span><div class="flex-1"><div class="body font-semibold">3 работы на телефоне</div><div class="small muted">Отправим сами, когда появится сеть</div></div>`:`<span class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:var(--prs);color:var(--pr)">${ic('check',22,'currentColor',2.6)}</span><div class="flex-1"><div class="body font-semibold">Всё отправлено</div><div class="small muted">30 работ · сегодня, 18:05</div></div>`}</div></div>
  <div class="eyebrow mt-7 mb-2 px-1">Последние работы</div>
  <div class="card px-4">${(st.offline?[['Килешләр','7-А','16 работ','Отправлено · 18:05','ok'],['Күплек сан','7-Б','12 из 14','Ждёт сети · 3 работы','wait'],['Диктант','8-Б','—','Бланки не напечатаны','none']]:[['Килешләр','7-А','16 работ','Отправлено · 18:05','ok'],['Күплек сан','7-Б','14 работ','Отправлено · 17:40','ok'],['Диктант','8-Б','—','Бланки не напечатаны','none']]).map(([t,c,n,s,k])=>`<div class="row"><span class="w-10 h-10 rounded-xl flex items-center justify-center small font-bold flex-none" style="background:var(--s3)">${c}</span><div class="flex-1 min-w-0"><div class="small font-semibold">${t} <span class="faint font-normal">· ${n}</span></div><div class="cap mt-0.5 flex items-center gap-1.5" style="color:${k==='ok'?'var(--pr)':k==='wait'?'var(--wa)':'var(--fa)'}">${k==='ok'?ic('check',13,'currentColor',3):k==='wait'?ic('clock',13):''}${s}</div>${k==='wait'?`<div class="h-1 rounded-full mt-2" style="background:var(--s3)"><div class="h-full rounded-full" style="width:78%;background:var(--wa)"></div></div>`:''}</div></div>`).join('')}</div>
  <div class="card px-4 mt-4">${[['people','Классы и ученики'],['copy','Экспорт в журнал'],['cpu','Распознавание · модель 1.3'],['shield','Для завуча и директора','trust']].map(([i,t,g])=>`<div class="row" ${g?`data-go="${g}"`:''} style="cursor:pointer;padding:15px 0"><span class="muted">${ic(i,20)}</span><span class="flex-1 small font-medium">${t}</span><span class="faint">${ic('chev',18)}</span></div>`).join('')}</div>
  </div>${nav('more')}</div>`
};
Object.keys(AR).forEach(k=>{if(!R[k])R[k]=AR[k]});

/* ---------- engine ---------- */
const screenEl=document.getElementById('screen');
function go(id){const i=idx(id);if(i>=0){cur=i;render()}}
function render(keep){timers.forEach(clearTimeout);timers=[];const s=SCREENS[cur];let html=R[s.id]();
  const over=OVER[s.id]&&(OVER[s.id]===prevId)||(prevId&&OVER[prevId]===s.id);
  const dir=keep||over||prevId===s.id||prevId===null?'':(idx(prevId)<cur?'fwd':'bwd');
  if(dir)html=html.replace('class="view"','class="view '+dir+'"');
  if(keep||over||OVER[s.id])html=html.replace(/class="scroll stagger"/g,'class="scroll"');
  screenEl.innerHTML=html+(st.toast?`<div class="toast"><span class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#0D8F54">${ic('check',20,'#fff',2.6)}</span>${st.toast}</div>`:'')+'<div class="gbar"></div>';prevId=s.id;
  if(!STILL&&!keep&&!OVER[s.id])screenEl.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};el.textContent='0';requestAnimationFrame(step)});
  if(s.id==='review')bindSwipe();
  if(s.id==='done'&&!STILL&&!keep)confetti();
  document.getElementById('counter').textContent=`${cur+1} / ${SCREENS.length}`;rail();notes();
  if(s.id==='scan'&&st.auto&&!keep)runScan()}
function confetti(){const c=document.getElementById('conf');if(!c)return;const cols=['#25E38A','#5CC8F0','#F5B942','#B69CFF','#F2F6F3'];c.innerHTML=Array.from({length:42},(_,k)=>`<i class="confetti" style="left:${Math.random()*100}%;background:${cols[k%5]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s"></i>`).join('')}
function shoot(){const T=(f,ms)=>timers.push(setTimeout(f,ms));const b=document.getElementById('brk');if(!b)return;b.classList.add('lock');const h=document.getElementById('hint');h.textContent='Держите';h.style.color='#25E38A';
  T(()=>{const f=document.getElementById('flash');if(!f)return;f.classList.add('go');document.getElementById('hap').classList.add('go');const i=st.scanned%16;st.scanned=Math.min(16,st.scanned+1);
    ['cnt','badge'].forEach(id=>{const c=document.getElementById(id);c.textContent=st.scanned;c.classList.add('bump')});document.getElementById('pbar').style.width=st.scanned/16*100+'%';h.parentElement.style.opacity=0;
    const g=grade(i);document.getElementById('toastScan').innerHTML=`<div class="toast" style="top:530px;bottom:auto">${gpill(g,36)}<div class="flex-1"><div>${STUDENTS[i]}</div><div class="text-[13px] font-medium" style="color:#56655C">${score(i)} из 6${REV.includes(i)?' · 1 спорная буква':''}</div></div></div>`},800);
  T(()=>{const p=document.getElementById('paper');if(p)p.classList.add('out')},1800);
  T(()=>{if(SCREENS[cur].id!=='scan')return;if(st.scanned===12&&!st.whoShown){st.whoShown=1;go('who')}else if(st.scanned<16)render();else go('done')},2500)}
function runScan(){if(STILL)return;timers.push(setTimeout(shoot,1100))}
function rail(){const s=SCREENS[cur];document.getElementById('rail').innerHTML=STAGES.map((t,n)=>{const list=SCREENS.map((x,i)=>({x,i})).filter(o=>o.x.stage===n);const on=s.stage===n;
  return `<button data-jump="${list[0].i}" class="text-left py-1.5 flex items-center gap-3 text-sm ${on?'text-[var(--foreground)] font-medium':'text-[var(--muted-foreground)]'} hover:text-[var(--foreground)]"><span class="w-1.5 h-1.5 rounded-full" style="background:${on?'#25E38A':'transparent'};box-shadow:0 0 0 1px ${on?'#25E38A':'currentColor'}"></span>${t}<span class="text-xs opacity-50 ml-auto">${list.length}</span></button>${on?`<div class="ml-[18px] mb-1 flex flex-col">${list.map(o=>`<button data-jump="${o.i}" class="text-left text-[13px] py-1 ${o.i===cur?'text-[var(--foreground)]':'text-[var(--muted-foreground)]'} hover:text-[var(--foreground)]">${o.x.title}</button>`).join('')}</div>`:''}`}).join('')}
function notes(){const s=SCREENS[cur];document.getElementById('notes').innerHTML=`
  <div class="text-xs uppercase tracking-wider text-[var(--muted-foreground)]">${STAGES[s.stage]}</div>
  <h2 class="text-2xl font-semibold mt-1">${s.title}</h2>
  <p class="text-[var(--muted-foreground)] mt-3">Боль: ${s.pain}</p>
  <ul class="mt-5 flex flex-col gap-2.5">${s.sol.map(x=>`<li class="flex gap-3"><span class="mt-2 w-1.5 h-1.5 rounded-full flex-none" style="background:#25E38A"></span><span>${x}</span></li>`).join('')}</ul>
  ${s.meta?`<p class="text-sm text-[var(--muted-foreground)] mt-5">${s.meta}</p>`:''}
  ${s.ref.length?`<div class="text-xs uppercase tracking-wider text-[var(--muted-foreground)] mt-6">Паттерн из Mobbin / рынка</div><div class="mt-2 flex flex-wrap gap-2">${s.ref.map(([t,u])=>`<a href="${u}" target="_blank" class="text-sm px-3 h-8 inline-flex items-center rounded-lg border border-[var(--border)] hover:bg-[var(--card)]">${t}</a>`).join('')}</div>`:''}
  ${s.demo==='offline'?`<button data-demo="offline" class="mt-6 text-sm px-3 h-9 rounded-lg border border-[var(--border)] hover:bg-[var(--card)]">Демо: ${st.offline?'вернуть сеть':'выключить сеть'}</button>`:''}`}
function decide(v){const c=document.getElementById('rcard');if(c){c.style.transition='transform .35s cubic-bezier(.22,1,.36,1),opacity .35s';c.style.transform=`translateX(${v==='ok'?420:-420}px) rotate(${v==='ok'?18:-18}deg)`;c.style.opacity=0}
  timers.push(setTimeout(()=>{st.decided++;st.last=v;st[v==='ok'?'yes':'no']=(st[v==='ok'?'yes':'no']||0)+1;st.review=Math.max(0,st.review-1);if(st.decided>=3){st.decided=0;go('test')}else render(true)},260))}
function bindSwipe(){const c=document.getElementById('rcard');if(!c)return;let x0=null,dx=0;const ok=c.querySelector('.stamp.ok'),no=c.querySelector('.stamp.no');
  c.addEventListener('pointerdown',e=>{x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'});
  c.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;ok.style.opacity=Math.max(0,dx/90);no.style.opacity=Math.max(0,-dx/90);c.style.background=dx>0?`color-mix(in srgb,#14301F ${Math.min(100,dx)}%,#131916)`:`color-mix(in srgb,#2E1818 ${Math.min(100,-dx)}%,#131916)`});
  c.addEventListener('pointerup',()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>90)decide(dx>0?'ok':'no');else{c.style.transition='transform .4s cubic-bezier(.34,1.56,.64,1)';c.style.transform='';ok.style.opacity=0;no.style.opacity=0;c.style.background=''}dx=0})}
const TOASTS={cards:'Карточки добавлены в печать',copy:'Скопировано · вставьте в Word',pdf:'PDF готов · выберите получателя'};
screenEl.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-stu],[data-task],[data-col],[data-sort],[data-letter],[data-act],[data-period],[data-seg],[data-toggle],[data-topic],[data-decide],[data-undo],[data-groupok],[data-copy],[data-auto]');if(!t)return;const d=t.dataset;
  if(d.stu!==undefined){st.student=+d.stu;go('student')}
  else if(d.task!==undefined){st.task=+d.task;go('task')}
  else if(d.col!==undefined){st.col=st.col===+d.col?null:+d.col;render(true)}
  else if(d.sort){st.sort=d.sort;render(true)}
  else if(d.period){st.period=d.period;render(true)}
  else if(d.letter!==undefined){st.letter=d.letter||null;render(true)}
  else if(d.seg!==undefined){st.seg=+d.seg;render(true)}
  else if(d.auto!==undefined){st.auto=d.auto==='1';render()}
  else if(d.act==='shoot'){timers.forEach(clearTimeout);timers=[];shoot()}
  else if(d.act){st.toast=TOASTS[d.act];render(true);setTimeout(()=>{st.toast='';render(true)},1800)}
  else if(d.toggle){st[d.toggle]=!st[d.toggle];render(true)}
  else if(d.topic){st.topic=d.topic;render(true)}
  else if(d.decide){decide(d.decide)}
  else if(d.undo){st.decided=Math.max(0,st.decided-1);st[st.last==='ok'?'yes':'no']--;st.review++;render(true)}
  else if(d.groupok){st.decided=Math.max(st.decided,1);st.last='ok';st.yes=(st.yes||0)+1;st.review=Math.max(0,st.review-1);cur=idx('review');render(true)}
  else if(d.copy){st.copied=true;render(true)}
  else if(d.go){if(d.go==='task')st.task=3;go(d.go)}});
document.getElementById('notes').addEventListener('click',e=>{if(e.target.closest('[data-demo]')){st.offline=!st.offline;render(true)}});
document.getElementById('rail').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(b){cur=+b.dataset.jump;render()}});
document.getElementById('prev').onclick=()=>{cur=(cur-1+SCREENS.length)%SCREENS.length;render()};
document.getElementById('next').onclick=()=>{cur=(cur+1)%SCREENS.length;render()};
document.addEventListener('keydown',e=>{if(SCREENS[cur].id==='review'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){decide(e.key==='ArrowRight'?'ok':'no');return}if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});
{const [h,m]=location.hash.slice(1).split('~');const i=idx(h);if(i>=0)cur=i;if(m==='still'){STILL=true;document.body.classList.add('still')}if(location.hash.includes('col'))st.col=3;if(location.hash.includes('letter'))st.letter='ә';if(location.hash.includes('off'))st.offline=true}
render();

</script>
</body>
</html>
