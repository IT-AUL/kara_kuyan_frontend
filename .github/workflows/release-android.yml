name: Release Android

# Tag `vX.Y.Z` (must equal app.json "version") -> signed per-ABI APKs attached to a GitHub Release.
# Manual run builds the same APKs as a workflow artifact; tick `publish` to also cut a release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release from this run (needs the tag vX.Y.Z to be the selected ref)
        type: boolean
        default: false
      allow_debug_signing:
        description: Dry run without release keystore (debug-signed, never published)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build signed APKs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      ANDROID_ABIS: arm64-v8a,armeabi-v7a,x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_type != 'tag' }}

      - name: Verify OCR model checksums
        run: cd models/ocr && sha256sum -c SHA256SUMS

      - name: Resolve version
        id: meta
        run: |
          version=$(node -p "require('./app.json').expo.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.json version ${version}"
            exit 1
          fi
          # versionCode: monotonically increasing, MAJOR*1e6 + MINOR*1e4 + PATCH*1e2 + attempt (<100)
          IFS=. read -r major minor patch <<<"${version%%-*}"
          echo "version_code=$(( major*1000000 + minor*10000 + patch*100 + (GITHUB_RUN_ATTEMPT % 100) ))" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.allow_debug_signing }}" = "true" ]; then
            echo "::warning::No keystore — building with the DEBUG key (dry run, will not be published)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. See docs/delivery/release.md"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Decode keystore
        if: steps.signing.outputs.release == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KK_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Generate native project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Patch release config
        env:
          KK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/ci/patch-android-release.mjs ${{ steps.signing.outputs.release != 'true' && '--allow-debug-signing' || '' }}

      - name: Assemble release APKs
        working-directory: android
        env:
          KK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: >
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          -PreactNativeArchitectures=${{ env.ANDROID_ABIS }}
          -Pexpo.useLegacyPackaging=true
          -Pkk.versionCode=${{ steps.meta.outputs.version_code }}
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect, verify, checksum
        id: collect
        run: |
          set -euo pipefail
          out=dist; mkdir -p "$out"
          version='${{ steps.meta.outputs.version }}'
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for src in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$src" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            dst="$out/kara-kuyan-v${version}-${abi}.apk"
            cp "$src" "$dst"
            "$apksigner" verify --verbose "$dst" | grep -E "Verifies|v2 scheme|v3 scheme"
          done
          ls "$out" | grep -c apk | grep -qx 4 || { echo "::error::expected 4 APKs (3 ABIs + universal)"; ls "$out"; exit 1; }
          (cd "$out" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: kara-kuyan-android-v${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kara-kuyan-android-v${{ needs.build.outputs.version }}
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          # Кара Куян ${VERSION}

          Android 7.0+. Телефону подойдёт \`arm64-v8a\` (почти все современные); \`armeabi-v7a\` — старые 32-битные; \`universal\` — если не уверены; \`x86_64\` — эмуляторы.
          Целостность: \`sha256sum -c SHA256SUMS.txt\`.
          NOTES
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Кара Куян $VERSION" \
            --notes-file notes.md --generate-notes --verify-tag $flags
