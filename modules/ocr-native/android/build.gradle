plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ocrnative'
version = '0.1.0'

def tatarOcrSubmoduleDir = file("${projectDir}/../../../third_party/tatar_ocr")
def extractedOrtDir = file("${buildDir}/ort-native")
def generatedTatarAssetsDir = file("${buildDir}/generated/tatar_ocr_assets")

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

configurations {
  ortAar
}

tasks.register('extractOrtNative', Copy) {
  from({ zipTree(configurations.ortAar.singleFile) }) {
    include 'headers/**'
    include 'jni/**'
  }
  into extractedOrtDir
}

tasks.register('prepareTatarOcrAssets', Copy) {
  from("${tatarOcrSubmoduleDir}/pipeline_spec.json")
  from("${tatarOcrSubmoduleDir}/models/tatar_ocr_v4_handwritten39_int8.onnx")
  from("${tatarOcrSubmoduleDir}/models/tatar_ocr_v4_handwritten39_fp32.onnx")
  into generatedTatarAssetsDir
}

android {
  namespace "expo.modules.ocrnative"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"

    ndk {
      abiFilters (*reactNativeArchitectures())
    }

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20 -O3"
        arguments "-DANDROID_STL=c++_shared",
                  "-DTATAR_OCR_BUILD_PYTHON=OFF",
                  "-DTATAR_OCR_SUBMODULE_DIR=${tatarOcrSubmoduleDir.absolutePath}",
                  "-DONNXRUNTIME_EXTRACTED_DIR=${extractedOrtDir.absolutePath}"
      }
    }
  }

  buildFeatures {
    prefab true
  }

  externalNativeBuild {
    cmake {
      path file("src/main/cpp/CMakeLists.txt")
      version "3.22.1"
    }
  }

  // Ship pipeline_spec.json + tatar_ocr_v4_handwritten39_int8.onnx directly from third_party/tatar_ocr.
  sourceSets {
    main {
      assets.srcDirs += generatedTatarAssetsDir
    }
  }
}

afterEvaluate {
  tasks.matching {
    it.name == 'preBuild' ||
    it.name.startsWith('configureCMake') ||
    it.name.startsWith('buildCMake') ||
    (it.name.contains('Assets') && (it.name.startsWith('merge') || it.name.startsWith('generate') || it.name.startsWith('package')))
  }.configureEach {
    dependsOn('extractOrtNative', 'prepareTatarOcrAssets')
  }
}

dependencies {
  ortAar 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
  implementation 'org.opencv:opencv:5.0.0'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  implementation 'androidx.camera:camera-core:1.6.2'
  implementation 'androidx.camera:camera-camera2:1.6.2'
  implementation 'androidx.camera:camera-lifecycle:1.6.2'
  implementation 'androidx.camera:camera-view:1.6.2'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
