<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Generated from src/design-system/tokens.ts — do not edit. */
:root {
  --color-background: #0B0F0D;
  --color-surface: #141A17;
  --color-surface-raised: #1B241F;
  --color-surface-soft: #101512;
  --color-primary: #25E38A;
  --color-primary-deep: #0D8F54;
  --color-primary-soft: #173B2C;
  --color-success-soft: #A7F3C8;
  --color-text: #F4F8F5;
  --color-text-muted: #99AAA1;
  --color-text-faint: #82948A;
  --color-divider: #2A352E;
  --color-warning: #F5B942;
  --color-warning-soft: #3A2D13;
  --color-error: #FF6868;
  --color-error-soft: #3B1D1D;
  --color-overlay: rgba(4, 8, 6, 0.72);
  --color-paper: #DCE5DF;
  --color-paper-muted: #4B5B52;
  --color-scan-backdrop: #030604;
  --color-transparent: transparent;
  --space-xxs: 4px;
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 20px;
  --space-xl: 24px;
  --space-xxl: 32px;
  --space-xxxl: 40px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;
  --radius-pill: 999px;
  --font-size-caption: 12px;
  --font-size-body-small: 14px;
  --font-size-body: 16px;
  --font-size-title-small: 18px;
  --font-size-title: 22px;
  --font-size-display: 30px;
  --font-size-hero: 40px;
  --font-family: 'Onest', 'Noto Sans', system-ui, sans-serif;
  --touch-target: 48px;
}

*{box-sizing:border-box}
body{margin:0;padding:var(--space-lg);background:var(--color-background);color:var(--color-text);font-family:var(--font-family);font-size:16px;line-height:22px}
.row{display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center}
.col{display:flex;flex-direction:column;gap:var(--space-sm)}
.cap{color:var(--color-text-faint);font-size:12px;line-height:16px;font-weight:500}
.muted{color:var(--color-text-muted);font-size:14px;line-height:20px}

</style></head><body><div class="col" style="max-width:360px">
   <button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:var(--radius-md);font:600 16px var(--font-family);border:1px solid transparent;cursor:pointer;background:var(--color-primary);color:var(--color-background)">Продолжить проверку</button>
   <button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:var(--radius-md);font:600 16px var(--font-family);border:1px solid transparent;cursor:pointer;background:var(--color-surface-raised);border-color:var(--color-divider);color:var(--color-text)">Изменить балл</button>
   <button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:var(--radius-md);font:600 16px var(--font-family);border:1px solid transparent;cursor:pointer;background:transparent;color:var(--color-primary)">Пропустить</button>
   <button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:var(--radius-md);font:600 16px var(--font-family);border:1px solid transparent;cursor:pointer;background:var(--color-error-soft);border-color:var(--color-error);color:var(--color-error)">Отметить ошибку</button>
   <button disabled style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:var(--radius-md);font:600 16px var(--font-family);border:1px solid transparent;cursor:pointer;background:var(--color-primary);color:var(--color-background);opacity:.45">Недоступно</button>
   <button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:var(--radius-md);font:600 16px var(--font-family);border:1px solid transparent;cursor:pointer;min-height:48px;background:var(--color-primary);color:var(--color-background)">Компактная</button></div></body></html>
